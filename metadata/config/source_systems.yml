# Source systems registered with the framework.
# connection_name must match a Fabric connection (Manage connections and gateways).

source_systems:
  - system_id: wwi_oltp
    type: azure_sql
    description: WideWorldImporters operational DB on wwimportsserver (Azure SQL DB, CDC enabled)
    connection_name: conn-azsql-wwi
    fabric_connection_id: 0c392ce3-5e9b-480c-ad22-281bd9428842   # DEV - swapped by fabric/parameter.yml
    server: wwimportsserver.database.windows.net
    database: WideWorldImporters-Standard

  - system_id: partner_files
    type: adls
    description: Partner landing zone (ADLS Gen2), event-triggered ingestion
    connection_name: conn-adls-landing
    container: landing
    base_path: partners/
