# fabric-cicd parameterization. fabric-cicd reads parameter.yml from the root of
# repository_directory (this fabric/ folder).
#
# Handled automatically by fabric-cicd, no entry needed:
#   - item logicalIds (e.g. lh_bronze's artifactId in Copy jobs) -> deployed item ids
#   - workspaceId 00000000-0000-0000-0000-000000000000 ("same workspace") -> target workspace
#
# Everything below is a DEV value that must be swapped per environment.
# Replace the TEST/PROD placeholders once those connections exist
# (Settings -> Manage connections and gateways -> connection -> Settings -> Connection ID).

find_replace:
  # conn-azsql-wwi (Azure SQL source for Copy jobs). DEV id also in metadata/config/source_systems.yml
  - find_value: "0c392ce3-5e9b-480c-ad22-281bd9428842"
    replace_value:
      TEST: "<test-conn-azsql-wwi-id>"
      PROD: "<prod-conn-azsql-wwi-id>"
    item_type: "CopyJob"

  # Lakehouse connection used as Copy job destination. DEV id also in metadata/config/fabric.yml
  - find_value: "b78c7ad5-0fb4-4519-9aa2-040611e7760b"
    replace_value:
      TEST: "<test-lakehouse-connection-id>"
      PROD: "<prod-lakehouse-connection-id>"
    item_type: "CopyJob"

  # DEV workspace id hard-coded by the Copy job activity in pl_master -> target workspace
  - find_value: "9d04974e-4eed-49f7-8f94-d136f1e83a45"
    replace_value:
      TEST: "$workspace.id"
      PROD: "$workspace.id"
    item_type: "DataPipeline"

  # sqldb_control connection used by pl_master Lookups / stored procedures
  - find_value: "495c388d-3495-4567-bf3b-60d7153cba76"
    replace_value:
      TEST: "<test-sqldb_control-connection-id>"
      PROD: "<prod-sqldb_control-connection-id>"
    item_type: "DataPipeline"

  # Connection used by pl_master's Copy job activity
  - find_value: "bf33c8a8-b035-4510-8f47-d1a1e75c2705"
    replace_value:
      TEST: "<test-copyjob-activity-connection-id>"
      PROD: "<prod-copyjob-activity-connection-id>"
    item_type: "DataPipeline"

  # Eventhouse query URI (add once the Eventhouse exists)
  # - find_value: "https://<dev>.kusto.fabric.microsoft.com"
  #   replace_value:
  #     TEST: "https://<test>.kusto.fabric.microsoft.com"
  #     PROD: "https://<prod>.kusto.fabric.microsoft.com"
