# fabric-cicd parameterization. fabric-cicd reads parameter.yml from the root of
# repository_directory (this fabric/ folder).
#
# After the first Git sync from DEV, replace the placeholder find_values with
# the real DEV GUIDs found in fabric/**/  (lakehouse IDs, workspace ID, connection IDs).

find_replace:
  # DEV workspace id -> target workspace id
  - find_value: "00000000-0000-0000-0000-00000000dev0"
    replace_value:
      TEST: "00000000-0000-0000-0000-0000000test0"
      PROD: "00000000-0000-0000-0000-0000000prod0"

  # lh_bronze item id
  - find_value: "11111111-1111-1111-1111-111111111dev"
    replace_value:
      TEST: "11111111-1111-1111-1111-11111111test"
      PROD: "11111111-1111-1111-1111-11111111prod"

  # Azure SQL source connection (Copy jobs): dev DB -> test/prod DB connection id
  - find_value: "22222222-2222-2222-2222-222222222dev"
    replace_value:
      TEST: "22222222-2222-2222-2222-22222222test"
      PROD: "22222222-2222-2222-2222-22222222prod"

  # Eventhouse query URI
  - find_value: "https://dev-xxxx.kusto.fabric.microsoft.com"
    replace_value:
      TEST: "https://test-xxxx.kusto.fabric.microsoft.com"
      PROD: "https://prod-xxxx.kusto.fabric.microsoft.com"
