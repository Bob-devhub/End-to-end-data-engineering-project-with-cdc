name: Sync metadata

# Promotion between stages is done by the Fabric deployment pipeline (Dev -> Test -> Prod).
# This workflow does the one thing a deployment can't: load the Git metadata (metadata/config)
# into the target stage's sqldb_control, and resolve that stage's Copy job ids for pl_master.
#
# Run it after each deployment that changes metadata or Copy jobs.
# GitHub Environments "TEST" and "PROD" (add required reviewers on PROD) need:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID   (sp-fabric-retail, federated credential for OIDC)
#   vars:    FABRIC_WORKSPACE_ID, CONTROL_DB_SERVER, CONTROL_DB_NAME   (from that stage's sqldb_control)
# sp-fabric-retail needs Contributor on the stage's workspace (that covers sqldb_control).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target stage
        type: choice
        options: [TEST, PROD]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ODBC driver
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install
        run: pip install -e ".[db]"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Sync metadata to control DB
        env:
          CONTROL_DB_SERVER: ${{ vars.CONTROL_DB_SERVER }}
          CONTROL_DB_NAME: ${{ vars.CONTROL_DB_NAME }}
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}   # resolves this stage's Copy job ids
        run: python scripts/sync_metadata.py
