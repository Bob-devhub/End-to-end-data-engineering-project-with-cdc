name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Unit tests
        run: pytest -q

      - name: Copy jobs in fabric/ match metadata
        run: python scripts/generate_copy_jobs.py --check

      - name: Generate KQL
        run: python scripts/deploy_kql.py

      - name: Upload generated KQL
        uses: actions/upload-artifact@v4
        with:
          name: kql
          path: kql/generated/

      - name: Build framework wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
