name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Unit tests
        run: pytest -q

      - name: Generate artifacts (KQL + Copy job specs)
        run: |
          python scripts/deploy_kql.py
          python scripts/generate_copy_jobs.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            kql/generated/
            build/copy_jobs/

      - name: Build framework wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
