[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-framework"
version = "0.1.0"
description = "Metadata-driven batch + CDC + real-time data platform on Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
db = ["pyodbc>=5.1", "azure-identity>=1.17"]
kusto = ["azure-kusto-data>=4.5", "azure-identity>=1.17"]
sim = ["azure-eventhub>=5.12"]
deploy = ["fabric-cicd>=0.1.20", "azure-identity>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "fabric"]  # Fabric notebooks use runtime globals (spark, notebookutils)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
